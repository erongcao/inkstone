[package]
name = "inkstone"
version = "0.1.0"
description = "开源 Markdown 编辑器 —— 类 Typora 的 Live Preview 混合编辑体验"
authors = ["Inkstone contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/inkstone-editor/inkstone"

# Tauri v2 约定：lib 供移动端入口复用，binary 只做转发
[lib]
name = "inkstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync"] }

# 发布构建瘦身：体积和启动速度对写作工具很关键
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
