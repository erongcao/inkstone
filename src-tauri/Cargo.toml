[package]
name = "inkstone"
version = "0.2.0"
description = "开源 Markdown 编辑器 —— 类 Typora 的 Live Preview 混合编辑体验"
authors = ["Inkstone contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/erongcao/inkstone"
homepage = "https://github.com/erongcao/inkstone"
keywords = ["markdown", "editor", "typora", "live-preview", "tauri"]
categories = ["text-editors"]

# Tauri v2 约定：lib 供移动端入口复用，binary 只做转发
[lib]
name = "inkstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 图片走 base64 文本通道：Tauri 的 JSON IPC 会把字节数组展开成数字列表
base64 = "0.22"
tokio = { version = "1", features = ["fs", "sync"] }
# 全局搜索：正则匹配 + 目录遍历。两者都已在 Cargo.lock 里（传递依赖），
# 声明为直接依赖不会引入新下载。
regex = "1"
walkdir = "2"
tauri-plugin-clipboard-manager = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.3", features = ["stream", "json", "native-tls"] }
futures-util = "0.3.34"

[dev-dependencies]
# 只在测试里用：验证 shortcuts.json 里的加速键**真的能被 muda 解析**。
# muda 是 tauri 的传递依赖，已经在 Cargo.lock 里，声明为直接依赖不会引入新下载。
# 为什么需要它：muda 解析失败时不报错，只是菜单项没有加速键——
# 那种 bug 靠肉眼是发现不了的。
#
# default-features = false：feature 是「取并集」的，
# 关掉自己的默认值后，最终启用的还是 tauri 那套（serde + gtk3），
# 不会给 Linux 构建引入新的系统依赖。
muda = { version = "0.20", default-features = false }

# 发布构建瘦身：体积和启动速度对写作工具很关键
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
