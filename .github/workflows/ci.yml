name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端检查（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 格式检查
        run: pnpm format:check

      - name: 单元测试 / round-trip
        run: pnpm test

      - name: 校验 i18n 用法
        # 模块常量里调 t() 会在**导入时定型**——
        # 模块第一次被加载时是什么语言，label 就永远是那个语言。
        # 换语言之后界面的一部分一直是上一种语言，而这种不一致不会报错。
        run: pnpm i18n:check

      - name: 校验快捷键清单未过期
        # src-tauri/shortcuts.json 是从 src/shortcuts.ts 生成的。
        # 改了注册表却忘了重新生成 → Rust 菜单里的加速键与前端不一致，
        # 而这种不一致不会报错，只会「按下去没反应」。
        run: pnpm gen:shortcuts -- --check

      - name: 校验打包元数据是 ASCII
        # Windows 的 MSI 数据库代码页是 1252，装不下中文。
        # 文件关联的 description 会被写进每个扩展名的 <ProgId Description="…">，
        # 一旦有中文，Windows 打包 job 会在编译完七八分钟后挂在 WiX 上。
        # 这道闸门在秒级就能拦下它。
        run: pnpm bundle:check

      - name: 前端构建
        run: pnpm exec vite build

  licenses:
    name: 依赖许可证白名单
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 扫描依赖许可证
        run: pnpm licenses:check

  rust:
    name: Rust 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Rust job 也要跑 pnpm（tauri build 前要装前端依赖），
      # 所以不能省掉 pnpm/action-setup —— 首跑就是漏了它，
      # 结果 `pnpm: command not found` 直接 127 退出。
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - name: cargo fmt 校验
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  build:
    name: 打包（${{ matrix.os }}）
    needs: [frontend, rust, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Windows on ARM：公开仓库可用的 windows-11-arm runner。
          # 它是较新的 runner，失败不影响其它平台的结论，
          # 所以单独放一个 job 而不是塞进上面的矩阵。
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            allow_failure: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - run: pnpm install --frozen-lockfile
      - name: 构建应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }}
